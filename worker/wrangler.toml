name = "daa-feedback"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
ALLOWED_ORIGINS = "https://laurinh25.github.io,http://localhost:8765"

# At most 10 feedback requests per minute per visitor.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60
